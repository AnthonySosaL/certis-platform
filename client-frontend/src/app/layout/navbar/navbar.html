<mat-toolbar class="navbar">
  <a routerLink="/" class="navbar__brand">
    <span class="navbar__brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 10 12 5 2 10l10 5 10-5Z" />
        <path d="M6 12v5c0 1.5 2.5 3 6 3s6-1.5 6-3v-5" />
      </svg>
    </span>
    <span>{{ brandName }}</span>
  </a>

  <nav class="navbar__links" aria-label="Primary">
    @for (item of navItems; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="navbar__link--active"
        [routerLinkActiveOptions]="{ exact: item.path === '/' }"
        class="navbar__link"
      >
        {{ item.label }}
      </a>
    }
  </nav>

  <span class="navbar__spacer"></span>

  <button
    mat-icon-button
    type="button"
    [attr.aria-label]="theme.mode() === 'light' ? 'Switch to dark mode' : 'Switch to light mode'"
    (click)="theme.toggle()"
  >
    @if (theme.mode() === 'light') {
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
      </svg>
    }
  </button>

  @if (auth.isAuthenticated()) {
    <button mat-button type="button" class="navbar__sign-in" [matMenuTriggerFor]="accountMenu">
      {{ auth.email() }}
    </button>
    <mat-menu #accountMenu="matMenu">
      <button mat-menu-item type="button" (click)="signOut()">Sign out</button>
    </mat-menu>
  } @else {
    <button mat-flat-button type="button" class="navbar__sign-in" routerLink="/login">Sign in</button>
  }

  <button
    mat-icon-button
    type="button"
    class="navbar__menu-trigger"
    aria-label="Menu"
    [matMenuTriggerFor]="mobileMenu"
  >
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>
</mat-toolbar>

<mat-menu #mobileMenu="matMenu">
  @for (item of navItems; track item.path) {
    <a mat-menu-item [routerLink]="item.path">{{ item.label }}</a>
  }
  @if (auth.isAuthenticated()) {
    <button mat-menu-item type="button" (click)="signOut()">Sign out ({{ auth.email() }})</button>
  } @else {
    <a mat-menu-item routerLink="/login">Sign in</a>
  }
</mat-menu>
