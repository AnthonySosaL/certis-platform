    <!--
      Boot splash: plain CSS/JS, inlined here (not in styles.scss) so it
      paints before the Angular bundle even finishes downloading - no
      flash of a blank page while the app boots. Colors match the "Navy &
      Gold" 3D seal used elsewhere (see docs/STRUCTURE_CHANGELOG.md), not
      the navbar's azure brand color - this is a deliberate one-off dark
      brand moment, not tied to the user's light/dark theme preference.

      Split into two half-width panels rather than one solid overlay so
      the exit can be a seal breaking open down the middle (two halves
      sliding apart) instead of a plain fade - see the "opening" class
      logic in the script below.
    -->
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        overflow: hidden;
      }
      .app-splash__panel {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 50%;
        transform-origin: 50% 0%;
        /* Two layers: a repeating fold gradient on top (curtain pleats -
           soft light/shadow bands, not hard stripes, so they read as
           rounded cloth rather than a barcode) and the same brand navy
           radial underneath. Sized as a percentage of each panel's own
           box, not the viewport - the two panels' folds don't need to
           line up at the center seam, real curtain panels don't either. */
        background-image:
          repeating-linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.08) 0%,
            rgba(255, 255, 255, 0.02) 3%,
            rgba(0, 0, 0, 0.16) 8%,
            rgba(0, 0, 0, 0.03) 13%,
            rgba(255, 255, 255, 0.08) 17%
          ),
          radial-gradient(circle at 50% 38%, #223969 0%, #101c3a 55%, #070c1a 100%);
        background-size:
          16% 100%,
          200% 100%;
      }
      .app-splash__panel--left {
        left: 0;
        /* A couple of extra pixels of width, overlapping the right panel,
           so sub-pixel rounding of the 50% split never leaves a hairline
           gap showing the page behind it. */
        width: calc(50% + 2px);
        background-position:
          0 0,
          0% 0%;
      }
      .app-splash__panel--right {
        right: 0;
        background-position:
          0 0,
          100% 0%;
      }
      /* A curtain has weight - it doesn't slide off in a straight line,
         it swings out past its resting point and settles back, like it's
         hung from a rod at the top (transform-origin above). */
      @keyframes app-splash-curtain-left {
        0% {
          transform: translateX(0) rotate(0deg);
        }
        50% {
          transform: translateX(-104%) rotate(-1.6deg);
        }
        72% {
          transform: translateX(-98%) rotate(0.8deg);
        }
        100% {
          transform: translateX(-100%) rotate(0deg);
        }
      }
      @keyframes app-splash-curtain-right {
        0% {
          transform: translateX(0) rotate(0deg);
        }
        50% {
          transform: translateX(104%) rotate(1.6deg);
        }
        72% {
          transform: translateX(98%) rotate(-0.8deg);
        }
        100% {
          transform: translateX(100%) rotate(0deg);
        }
      }
      #app-splash.app-splash--opening .app-splash__panel--left {
        animation: app-splash-curtain-left 1.1s cubic-bezier(0.3, 0, 0.2, 1) forwards;
      }
      #app-splash.app-splash--opening .app-splash__panel--right {
        animation: app-splash-curtain-right 1.1s cubic-bezier(0.3, 0, 0.2, 1) forwards;
      }
      .app-splash__center {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.9rem;
        transition: opacity 0.35s ease;
      }
      #app-splash.app-splash--opening .app-splash__center {
        opacity: 0;
      }
      .app-splash__stage {
        position: relative;
        width: 96px;
        height: 116px;
        perspective: 560px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .app-splash__glow {
        position: absolute;
        inset: -30%;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(212, 175, 55, 0.45) 0%, rgba(212, 175, 55, 0) 70%);
        filter: blur(6px);
        animation: app-splash-glow 2.4s ease-in-out infinite;
      }
      .app-splash__coin {
        position: relative;
        transform-style: preserve-3d;
        animation: app-splash-spin 2.4s ease-in-out infinite;
        filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.45));
      }
      .app-splash__ribbon {
        fill: #c9a24b;
      }
      .app-splash__disc {
        fill: #17233f;
        stroke: #d4af37;
        stroke-width: 0.6;
      }
      .app-splash__check {
        fill: none;
        stroke: #d4af37;
        stroke-width: 2.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      @keyframes app-splash-spin {
        0%,
        100% {
          transform: rotateY(0deg);
        }
        50% {
          transform: rotateY(180deg);
        }
      }
      @keyframes app-splash-glow {
        0%,
        100% {
          opacity: 0.5;
          transform: scale(0.92);
        }
        50% {
          opacity: 0.9;
          transform: scale(1.08);
        }
      }
      .app-splash__word {
        font-family: 'Roboto', sans-serif;
        font-weight: 500;
        font-size: 0.95rem;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.88);
        opacity: 0;
        animation: app-splash-word-in 0.6s ease both;
        animation-delay: 0.15s;
      }
      @keyframes app-splash-word-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .app-splash__status {
        font-family: 'Roboto', sans-serif;
        font-size: 0.78rem;
        font-weight: 400;
        letter-spacing: 0.01em;
        color: rgba(255, 255, 255, 0.58);
        min-height: 1.1em;
        transition:
          opacity 0.18s ease,
          transform 0.18s ease;
      }
      .app-splash__status--out {
        opacity: 0;
        transform: translateY(3px);
      }
      .app-splash__track {
        width: 160px;
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        overflow: hidden;
      }
      .app-splash__fill {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: linear-gradient(90deg, #b5872f, #ecd28a);
        transition: width 0.45s ease;
      }
      app-root:empty {
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .app-splash__coin,
        .app-splash__glow,
        .app-splash__word {
          animation: none;
          opacity: 1;
        }
        #app-splash.app-splash--opening .app-splash__panel--left,
        #app-splash.app-splash--opening .app-splash__panel--right {
          animation: none;
          transform: translateX(-100%);
        }
        #app-splash.app-splash--opening .app-splash__panel--right {
          transform: translateX(100%);
        }
        .app-splash__panel,
        .app-splash__center {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <app-root></app-root>

    <div id="app-splash" role="status" aria-label="Loading Certis">
      <div class="app-splash__panel app-splash__panel--left"></div>
      <div class="app-splash__panel app-splash__panel--right"></div>
      <div class="app-splash__center">
        <div class="app-splash__stage">
          <div class="app-splash__glow"></div>
          <svg class="app-splash__coin" viewBox="0 0 28 34" width="72" height="87" aria-hidden="true">
            <path class="app-splash__ribbon" d="M9 16 L7 32 L14 27 L21 32 L19 16Z" />
            <circle class="app-splash__disc" cx="14" cy="13" r="12" />
            <path class="app-splash__check" d="M8.5 13.5 12 17 19.5 9" />
          </svg>
        </div>
        <div class="app-splash__word">Certis</div>
        <div class="app-splash__status" id="app-splash-status">Loading resources&hellip;</div>
        <div class="app-splash__track"><div class="app-splash__fill" id="app-splash-fill"></div></div>
      </div>
    </div>
    <noscript>
      <style>
        #app-splash {
          display: none !important;
        }
      </style>
    </noscript>

    <script>
      (function () {
        var splash = document.getElementById('app-splash');
        var fill = document.getElementById('app-splash-fill');
        var status = document.getElementById('app-splash-status');
        var appRoot = document.querySelector('app-root');
        if (!splash || !fill || !status || !appRoot) return;

        // A staged, labeled sequence rather than one bar tied straight to
        // network events - the real load is often too quick for a bar
        // like that to read as more than a blink. Real readiness (the
        // observer below) still gates the very last step, so this never
        // claims "ready" before Angular actually is.
        var phases = [
          { pct: 14, label: 'Loading resources…' },
          { pct: 34, label: 'Preparing the placement engine…' },
          { pct: 58, label: 'Warming up the AI…' },
          { pct: 80, label: 'Polishing the details…' },
          { pct: 95, label: 'Almost ready…' },
        ];
        var phaseDelayMs = 480;
        var appReady = false;
        var finished = false;

        function setPhase(pct, label) {
          fill.style.width = pct + '%';
          status.classList.add('app-splash__status--out');
          setTimeout(function () {
            status.textContent = label;
            status.classList.remove('app-splash__status--out');
          }, 170);
        }

        function runPhases(index) {
          if (index >= phases.length) {
            if (appReady) {
              finish();
              return;
            }
            // The fake sequence finished before Angular actually has -
            // hold here and poll for the real signal instead of lying
            // about being done.
            var poll = setInterval(function () {
              if (appReady) {
                clearInterval(poll);
                finish();
              }
            }, 150);
            return;
          }
          setPhase(phases[index].pct, phases[index].label);
          setTimeout(function () {
            runPhases(index + 1);
          }, phaseDelayMs);
        }

        function finish() {
          if (finished) return;
          finished = true;
          setPhase(100, 'Ready');
          setTimeout(function () {
            splash.classList.add('app-splash--opening');
            setTimeout(function () {
              splash.remove();
            }, 1150);
          }, 420);
        }

        var observer = new MutationObserver(function () {
          if (appRoot.childNodes.length > 0) {
            observer.disconnect();
            appReady = true;
          }
        });
        observer.observe(appRoot, { childList: true });

        requestAnimationFrame(function () {
          runPhases(0);
        });

        // Safety net: never mask the app for more than ~9s even if the
        // observer above somehow never fires.
        setTimeout(finish, 9000);
      })();
    </script>
  </body>
</html>
