services:
  postgres:
    image: postgres:16-alpine
    container_name: app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_dev_only
      POSTGRES_DB: app_dev
    ports:
      # Host 5433, not 5432 — this machine already has another local
      # Postgres bound to 5432 (a separate, isolated setup — not part of
      # this project). See docs/errors/2026-08-26-postgres-port-conflict.md.
      - "5433:5432"
    volumes:
      - app-postgres-data:/var/lib/postgresql/data

volumes:
  app-postgres-data:
